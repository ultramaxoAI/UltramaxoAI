name: ultramaxo_mobile
description: UltramaxoAI - The Uncensored AI Workspace Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  webview_flutter: ^4.12.0
  flutter_markdown: ^0.7.6
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  provider: ^6.1.4
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.4.0
  cached_network_image: ^3.4.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0a0f14"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
