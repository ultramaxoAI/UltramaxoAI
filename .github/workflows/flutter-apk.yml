name: Build Ultramaxo Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: false

      - name: Scaffold Flutter App
        run: |
          # Generate a new flutter project to get the platform folders
          flutter create --org tech.ultramaxo /tmp/scaffold
          
          # Copy the generated platform folders to our mobile directory
          cp -R /tmp/scaffold/android mobile/
          cp -R /tmp/scaffold/ios mobile/ || true
          
          # Safely update AndroidManifest.xml using Python
          python -c '
          import os
          path = "mobile/android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()
              permissions = """<uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n"""
              if "android.permission.INTERNET" not in content:
                  content = content.replace("<application", permissions + "\n    <application")
              with open(path, "w") as f:
                  f.write(content)
          '

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultramaxo-Mobile-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
