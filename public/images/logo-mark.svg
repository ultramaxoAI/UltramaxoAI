<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Left half - dark navy circuit U shape -->
  <path d="M12 10 L12 50 Q12 66 28 66 L36 66 L36 58 L28 58 Q20 58 20 50 L20 10 Z" fill="#1a2d4a" />
  <path d="M20 10 L20 50 Q20 58 28 58 L36 58 L36 50 L28 50 Q28 50 28 48 L28 10 Z" fill="#1a2d4a" />

  <!-- Right half - silver/gray circuit U shape -->
  <path d="M68 10 L68 50 Q68 66 52 66 L44 66 L44 58 L52 58 Q60 58 60 50 L60 10 Z" fill="#8a939f" />
  <path d="M60 10 L60 50 Q60 58 52 58 L44 58 L44 50 L52 50 Q52 50 52 48 L52 10 Z" fill="#b0b8c4" />

  <!-- Center overlap area -->
  <rect x="28" y="10" width="8" height="56" fill="#1a2d4a" opacity="0.7"/>
  <rect x="44" y="10" width="8" height="56" fill="#8a939f" opacity="0.7"/>
  <rect x="36" y="10" width="8" height="56" fill="#4a6080" opacity="0.5"/>

  <!-- Circuit traces - left (navy) -->
  <line x1="16" y1="20" x2="16" y2="46" stroke="#0f1d33" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="16" x2="24" y2="44" stroke="#0f1d33" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="14" x2="32" y2="52" stroke="#0f1d33" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Circuit traces - right (silver) -->
  <line x1="48" y1="14" x2="48" y2="52" stroke="#6b7585" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="16" x2="56" y2="44" stroke="#6b7585" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="20" x2="64" y2="46" stroke="#6b7585" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Circuit nodes - left -->
  <circle cx="16" cy="28" r="3" fill="#dce4f2" stroke="#1a2d4a" stroke-width="1"/>
  <circle cx="24" cy="22" r="3" fill="#dce4f2" stroke="#1a2d4a" stroke-width="1"/>
  <circle cx="24" cy="38" r="3" fill="#dce4f2" stroke="#1a2d4a" stroke-width="1"/>
  <circle cx="32" cy="30" r="2.5" fill="#dce4f2" stroke="#1a2d4a" stroke-width="1"/>

  <!-- Circuit nodes - right -->
  <circle cx="48" cy="30" r="2.5" fill="#dce4f2" stroke="#6b7585" stroke-width="1"/>
  <circle cx="56" cy="22" r="3" fill="#dce4f2" stroke="#6b7585" stroke-width="1"/>
  <circle cx="56" cy="38" r="3" fill="#dce4f2" stroke="#6b7585" stroke-width="1"/>
  <circle cx="64" cy="28" r="3" fill="#dce4f2" stroke="#6b7585" stroke-width="1"/>
</svg>
